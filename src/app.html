<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="author" content="Foundational Technologies, LLC">
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "ProfessionalService",
			"@id": "https://foundtechsolutions.com/#org",
			"name": "Foundational Technologies LLC",
			"alternateName": "FoundTech",
			"url": "https://foundtechsolutions.com",
			"image": "https://foundtechsolutions.com/og-image.png",
			"description": "Veteran-owned custom software firm building inventory, job-tracking, and QuickBooks-integrated tools for small manufacturers and operations-heavy businesses. Makers of FullVue ERP.",
			"email": "sales@foundtechsolutions.com",
			"address": {
				"@type": "PostalAddress",
				"streetAddress": "1020 Hartzheim Dr.",
				"addressLocality": "Appleton",
				"addressRegion": "WI",
				"postalCode": "54913",
				"addressCountry": "US"
			},
			"areaServed": "United States",
			"knowsAbout": ["custom software development", "ERP", "inventory management", "QuickBooks integration"],
			"owns": {
				"@type": "SoftwareApplication",
				"name": "FullVue",
				"url": "https://fullvue.io",
				"applicationCategory": "BusinessApplication"
			}
		}
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk&display=swap" rel="stylesheet">
		%sveltekit.head%
		<style>
			html {
				box-sizing: border-box;
				font-size: 16px;
			}

			*, *:before, *:after {
				box-sizing: inherit;
			}

			:root {
				--blue: #2c5aa0;
				--lightblue: #8dc6e7;
				--green: #468a00;
			}

			body, h1, h2, h3, h4, h5, h6, p, ol, ul {
				margin: 0;
				padding: 0;
				font-weight: normal;
				font-family: 'Space Grotesk', sans-serif;
			}

			ol, ul {
				list-style: none;
			}

			img {
				max-width: 100%;
				height: auto;
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
